name: dawarich
services:
  dawarich-app:
    image: freikin/dawarich:1.14.2@sha256:5de477cfc6f8d9d19d7660c262acb196ea8a15cebbcbb7db173e04a2860f3bb5
    container_name: dawarich-app
    depends_on:
      dawarich-postgres:
        condition: service_healthy
        restart: true
      dawarich-redis:
        condition: service_healthy
        restart: true
    volumes:
      - ${DATA_DIR}/dawarich/public:/var/app/public
      - ${DATA_DIR}/dawarich/watched:/var/app/tmp/imports/watched
      - ${DATA_DIR}/dawarich/storage:/var/app/storage
      - dawarich-postgres:/dawarich_db_data
    environment:
      RAILS_ENV: production
      PUID: ${PUID}
      PGID: ${PGID}
      TIME_ZONE: ${TZ}
      REDIS_URL: redis://dawarich-redis:6379
      DATABASE_HOST: dawarich-postgres
      DATABASE_USERNAME: dawarich
      DATABASE_NAME: dawarich
      APPLICATION_HOSTS: dawarich.${HOST}
      RAILS_LOG_TO_STDOUT: 'true'
      STORE_GEODATA: 'true'
      WEB_CONCURRENCY: -1
    env_file: ../.secrets/dawarich
    networks:
      - dawarich
      - dawarich-web
    command:
      - bin/rails
      - server
    entrypoint: web-entrypoint.sh
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO - http://127.0.0.1:3000/api/v1/health | grep -q '"status"\s*:\s*"ok"'
      interval: 10s
      retries: 30
      start_period: 30s
      timeout: 10s
    labels:
      readme.description: Location History Tracker
      readme.links.github: https://github.com/Freika/dawarich
      readme.links.web: https://dawarich.app/
      traefik.docker.network: dawarich-web
      traefik.enable: true
      traefik.http.routers.dawarich-app.entrypoints: https
      traefik.http.routers.dawarich-app.rule: Host(`dawarich.${HOST}`)
      traefik.http.services.dawarich-app.loadbalancer.server.port: 3000
      glance.id: dawarich
      glance.name: Dawarich
      glance.icon: di:dawarich
      glance.url: https://dawarich.${HOST}
      glance.description: Self-Hosted Location History Tracker
      glance.category: cloud
    stdin_open: true
    tty: true
  dawarich-postgres:
    image: postgis/postgis:18-3.6-alpine@sha256:ffcf0c4b904e41b9779f8098007fb5a9484025319c18c70cf8e1bcebb742b9b7
    container_name: dawarich-postgres
    volumes:
      - dawarich-postgres:/var/lib/postgresql
      - ${DATA_DIR}/postgres/dawarich:/docker-entrypoint-initdb.d
      - ${DATA_DIR}/dawarich/shared:/var/shared
    secrets:
      - dawarich_postgres_password
    environment:
      POSTGRES_USER: dawarich
      POSTGRES_PASSWORD_FILE: /run/secrets/dawarich_postgres_password
      POSTGRES_DB: dawarich
    env_file: ../.secrets/dawarich
    networks:
      - dawarich
    command: |
      -c wal_compression=zstd
      -c checkpoint_completion_target=0.9
      -c checkpoint_timeout=30min
      -c max_wal_size=4GB
    restart: unless-stopped
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
        - CMD-SHELL
        - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      timeout: 5s
    labels:
      glance.parent: dawarich
      glance.name: DB
      glance.category: cloud
    shm_size: 1G
  dawarich-redis:
    image: redis:8.10.1@sha256:298e5b3bc566bade82f46ad5511777a4a07a294097ce16ada2f6a42be5239df5
    container_name: dawarich-redis
    volumes:
      - ${DATA_DIR}/dawarich/shared:/data
    networks:
      - dawarich
    command: >
      redis-server --save 900 1 --save 300 10 --appendonly no
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - redis-cli
        - --raw
        - incr
        - ping
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    labels:
      glance.parent: dawarich
      glance.name: KV
      glance.category: cloud
  dawarich-sidekiq:
    image: freikin/dawarich:1.14.2@sha256:5de477cfc6f8d9d19d7660c262acb196ea8a15cebbcbb7db173e04a2860f3bb5
    container_name: dawarich-sidekiq
    depends_on:
      dawarich-app:
        condition: service_healthy
        restart: true
      dawarich-postgres:
        condition: service_healthy
        restart: true
      dawarich-redis:
        condition: service_healthy
        restart: true
    volumes:
      - ${DATA_DIR}/dawarich/public:/var/app/public
      - ${DATA_DIR}/dawarich/watched:/var/app/tmp/imports/watched
      - ${DATA_DIR}/dawarich/storage:/var/app/storage
    environment:
      RAILS_ENV: production
      PUID: ${PUID}
      PGID: ${PGID}
      TIME_ZONE: ${TZ}
      REDIS_URL: redis://dawarich-redis:6379
      DATABASE_HOST: dawarich-postgres
      DATABASE_USERNAME: dawarich
      DATABASE_NAME: dawarich
      APPLICATION_HOSTS: dawarich.${HOST}
      BACKGROUND_PROCESSING_CONCURRENCY: 3
      RAILS_LOG_TO_STDOUT: 'true'
      STORE_GEODATA: 'true'
      WEB_CONCURRENCY: -1
    env_file: ../.secrets/dawarich
    networks:
      - dawarich
    command:
      - sidekiq
    entrypoint: sidekiq-entrypoint.sh
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pgrep -f sidekiq
      interval: 10s
      retries: 30
      start_period: 30s
      timeout: 10s
    labels:
      glance.parent: dawarich
      glance.name: Queue
      glance.category: cloud
    stdin_open: true
    tty: true
networks:
  dawarich:
    name: dawarich
  dawarich-web:
    name: dawarich-web
volumes:
  dawarich-postgres:
    name: dawarich-postgres
secrets:
  dawarich_postgres_password:
    file: ../.secrets/dawarich_postgres_password
