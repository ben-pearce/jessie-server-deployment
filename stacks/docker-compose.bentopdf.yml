name: bentopdf
services:
  bentopdf:
    image: ghcr.io/alam00000/bentopdf-simple:2.8.11@sha256:3bbab98791694b77bc70ab03bf1b2ea89e568a75ef172c27d95cbdbdf810038f
    container_name: bentopdf
    networks:
      - bentopdf-web
    restart: unless-stopped
    labels:
      readme.description: PDF Toolkit built for privacy.
      readme.links.gitlab: https://github.com/goodtab/bentopdf
      readme.links.website: https://www.bentopdf.com/
      traefik.docker.network: bentopdf-web
      traefik.enable: true
      traefik.http.routers.bentopdf.entrypoints: https
      traefik.http.routers.bentopdf.middlewares: authentik
      traefik.http.routers.bentopdf.rule: Host(`bentopdf.${HOST}`)
      traefik.http.services.bentopdf.loadbalancer.server.port: 8080
      glance.name: BentoPDF
      glance.icon: di:bentopdf
      glance.url: https://bentopdf.${HOST}
      glance.description: PDF Toolkit.
      glance.category: tools
networks:
  bentopdf-web:
    name: bentopdf-web
