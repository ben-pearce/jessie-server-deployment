name: paperless
include:
  - common/docker-compose.volumes.yml
services:
  paperless-gotenberg:
    image: docker.io/gotenberg/gotenberg:8.38@sha256:aa552cc115db488e0f0bcb07446aac13071ad51505b642c84bb894500907b42b
    container_name: paperless-gotenberg
    networks:
      - paperless
    command:
      - gotenberg
      - '--chromium-disable-javascript=true'
      - '--chromium-allow-list=file:///tmp/.*'
    restart: unless-stopped
    labels:
      glance.parent: paperless
      glance.name: Gotenberg
      glance.category: cloud
  paperless-ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.3.4@sha256:9bc6e8248891bcfa6f52fffe8b81e4ea8cae75790c3ec1b9906961a7ba55c969
    container_name: paperless-ngx
    depends_on:
      - paperless-gotenberg
      - paperless-postgres
      - paperless-redis
      - paperless-tika
    volumes:
      - ${DATA_DIR}/paperless/data:/usr/src/paperless/data
      - ${DATA_DIR}/paperless/media:/usr/src/paperless/media
      - ${DATA_DIR}/paperless/export:/usr/src/paperless/export
      - ${DATA_DIR}/paperless/consume:/usr/src/paperless/consume
      - ${LOG_DIR}/paperless:/usr/src/paperless/data/log
      - paperless:/usr/src/paperless/media/documents/originals
    secrets:
      - paperless_postgres_password
      - paperless_socialaccount_providers
      - paperless_secret_key
    environment:
      PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
      PAPERLESS_SOCIALACCOUNT_PROVIDERS_FILE: /run/secrets/paperless_socialaccount_providers
      PAPERLESS_SECRET_KEY_FILE: /run/secrets/paperless_secret_key
      PAPERLESS_REDIRECT_LOGIN_TO_SSO: true
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: paperless-postgres
      PAPERLESS_DBPASS_FILE: /run/secrets/paperless_postgres_password
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_ENDPOINT: http://paperless-tika:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://paperless-gotenberg:3000
      PAPERLESS_URL: https://paperless.${HOST}
      USERMAP_GID: ${PGID}
      USERMAP_UID: ${PUID}
    networks:
      - paperless
      - paperless-web
    restart: unless-stopped
    healthcheck:
      interval: 30s
      retries: 5
      test:
        - CMD
        - curl
        - '-fs'
        - '-S'
        - '--max-time'
        - '2'
        - http://localhost:8000
      timeout: 10s
    labels:
      readme.description: Document Management System.
      readme.links.github: https://github.com/paperless-ngx/paperless-ngx
      traefik.docker.network: paperless-web
      traefik.enable: true
      traefik.http.routers.paperless-ngx.entrypoints: https
      traefik.http.routers.paperless-ngx.rule: Host(`paperless.${HOST}`)
      traefik.http.services.paperless-ngx.loadbalancer.server.port: 8000
      glance.id: paperless
      glance.name: Paperless
      glance.icon: di:paperless
      glance.url: https://paperless.${HOST}
      glance.description: Document Management System
      glance.category: cloud
  paperless-postgres:
    image: postgres:18.6-alpine3.24@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    container_name: paperless-postgres
    volumes:
      - paperless-postgres:/var/lib/postgresql
      - ${DATA_DIR}/postgres/paperless:/docker-entrypoint-initdb.d
    secrets:
      - paperless_postgres_password
    environment:
      POSTGRES_DB: paperless
      POSTGRES_PASSWORD_FILE: /run/secrets/paperless_postgres_password
      POSTGRES_USER: paperless
    networks:
      - paperless
    command: |
      -c wal_compression=zstd
      -c checkpoint_completion_target=0.9
      -c checkpoint_timeout=30min
      -c max_wal_size=4GB
    restart: unless-stopped
    labels:
      glance.parent: paperless
      glance.name: DB
  paperless-redis:
    image: redis:8.10.2@sha256:97ec88159e6d7cfb5ddef9015386087d58a912de80112f06ebdfa78fa5989901
    container_name: paperless-redis
    volumes:
      - ${DATA_DIR}/redis/paperless:/data
    networks:
      - paperless
    restart: unless-stopped
    labels:
      glance.parent: paperless
      glance.name: KV
      glance.category: cloud
  paperless-scanner:
    image: manuc66/node-hp-scan-to:1.11.1@sha256:afe1ccbf8e9e3734b47ff798f5ee8b2086c63f749b4f9aca4b593dc9038f99a4
    container_name: paperless-scanner
    volumes:
      - ${DATA_DIR}/paperless/consume:/scan
    environment:
      IP: ${PRINTER_HOST}
      LABEL: Paperless
      PATTERN: '"scan"_dd.mm.yyyy_hh:MM:ss'
      PGID: ${PGID}
      PUID: ${PUID}
      TZ: ${TZ}
    networks:
      - paperless
    restart: unless-stopped
    labels:
      glance.parent: paperless
      glance.name: Scanner
      glance.category: cloud
  paperless-tika:
    image: apache/tika:3.3.3.0@sha256:326b238b37904c94ff61fed87afe0af72e6a29fa715933b10af97b7d56f1d4cb
    container_name: paperless-tika
    networks:
      - paperless
    restart: unless-stopped
    labels:
      glance.parent: paperless
      glance.name: Tika
      glance.category: cloud
    tmpfs:
      - /tmp:rw,mode=1777
networks:
  paperless:
    name: paperless
  paperless-web:
    name: paperless-web
volumes:
  paperless-postgres:
    name: paperless-postgres
secrets:
  paperless_postgres_password:
    file: ../.secrets/paperless_postgres_password
  paperless_socialaccount_providers:
    file: ../.secrets/paperless_socialaccount_providers
  paperless_secret_key:
    file: ../.secrets/paperless_secret_key
